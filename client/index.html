<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Portfolio of R. IHEB | Software Engineer specializing in Web & Mobile Systems." />
    <title>R. IHEB | Software Engineer Portfolio</title>
    
    <!-- Google Fonts: Plus Jakarta Sans (reference design) + JetBrains Mono + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container">
    <!-- Scroll Progress Bar -->
    <div id="scroll-progress"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Scroll Progress Script -->
    <script>
      window.addEventListener('scroll', () => {
        const bar = document.getElementById('scroll-progress');
        if (!bar) return;
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = pct + '%';
      }, { passive: true });
    </script>
  </body>
</html>
